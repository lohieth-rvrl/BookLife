{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'base/style.css' %}">
</head>
<body class="auth-bg">

<div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="text-center mb-4">
                <i class="bi bi-asterisk fs-1"></i>
                <h2 class="fw-bold mt-2">Create Account</h2>
                <p class="text-muted">Join Mate to manage your orders efficiently</p>
            </div>

            <div class="card auth-card border-0 shadow-sm p-4">

                <form method="post">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger small">
                            {{ form.non_field_errors.0 }}
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Username</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="demo"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="demo@example.com"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="password"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Confirm Password</label>
                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Re-enter password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">
                        Get Started
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">
                        Already have an account?
                        <a href="{% url 'accounts:login' %}" class="fw-bold text-dark text-decoration-none">
                            Sign in
                        </a>
                    </p>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
