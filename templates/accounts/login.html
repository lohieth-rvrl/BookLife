{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'base/style.css' %}">
</head>
<body class="auth-bg">

<div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="text-center mb-4">
                <i class="bi bi-asterisk fs-1"></i>
                <h2 class="fw-bold mt-2">Welcome Back</h2>
                <p class="text-muted">Enter your details to access your account</p>
            </div>

            <div class="card auth-card border-0 shadow-sm p-4">

                <form method="post">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger small">
                            {{ form.non_field_errors.0 }}
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">
                            Email Address
                        </label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label class="form-label small fw-bold text-muted text-uppercase">
                                Password
                            </label>
                            <a href="#" class="small text-decoration-none">Forgot?</a>
                        </div>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder=""
                            required
                        >
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label small" for="remember">
                            Keep me logged in
                        </label>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">
                        Don't have an account?
                        <a href="{% url 'accounts:register' %}" class="fw-bold text-dark text-decoration-none">
                            Create account
                        </a>
                    </p>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
