{% extends 'base/base.html' %}


{% block content %}
    <div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="text-center mb-4">
                <i class="bi bi-asterisk fs-1"></i>
                <h2 class="fw-bold mt-2">Add 
                    {% if member %}
                    <b class='text-primary'>{{member}}</b>
                    {% endif %}</h2>
            </div>

            <div class="card auth-card border-0 shadow-sm p-4">

                <form method="post">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger small">
                            {{ form.non_field_errors.0 }}
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Username</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="demo"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="demo@example.com"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="password"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Confirm Password</label>
                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Re-enter password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">
                        ADD {{member}}
                    </button>
                </form>

            </div>

        </div>
    </div>
</div>
{% endblock  %}
